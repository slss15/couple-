# Option B (locally-managed tunnel): cloudflared tunnel --config this.yml run
# With the compose token mode (remotely managed), add the same Public Hostnames in the
# Zero Trust dashboard IN THIS ORDER (first match wins).
tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json
ingress:
  # internal hooks never exposed
  - hostname: couple.example.com
    path: ^/api/v1/internal/.*
    service: http_status:404
  # push-to-deploy webhook + status -> updater (not via backend)
  - hostname: couple.example.com
    path: ^/_deploy/(hook|status)$
    service: http://updater:9000
  - hostname: couple.example.com
    path: ^/_deploy/.*
    service: http_status:404
  # MQTT over WSS
  - hostname: couple.example.com
    path: ^/mqtt.*
    service: http://emqx:8083
  # REST API
  - hostname: couple.example.com
    path: ^/api/.*
    service: http://backend:8080
  # admin SPA
  - hostname: couple.example.com
    service: http://admin:8080
  - service: http_status:404
