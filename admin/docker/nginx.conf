# Rendered by the nginx image's envsubst step (only ${BACKEND_UPSTREAM} is a template var).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS; resolving per request means nginx starts even when the backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream ${BACKEND_UPSTREAM};

    location = /config.js {
        alias /tmp/couple-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Internal hooks are never reachable through the admin frontend.
    location ^~ /api/v1/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
