name: admin

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: couple-admin-dist
          path: admin/dist
          retention-days: 7
