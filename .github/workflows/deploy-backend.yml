name: deploy

# Push-to-deploy: every push to main that touches backend/** or admin/** is tested and built twice:
#  - Windows-native package couple-server-windows-x64-edge-<short>.zip -> rolling `edge` prerelease
#    (reusable _windows-package.yml, smoke-tested on windows-latest);
#  - Docker images ghcr.io/<owner>/couple-<svc>:{sha-<short>, edge} (linux/amd64 + linux/arm64, optional path).
# Then the signed webhook (Cloudflare Tunnel -> updater) deploys whichever the server runs, chosen by the
# repository variable DEPLOY_TARGET = windows (default) | docker. The deploy job turns red if the server reports
# failure/rollback. Never runs for pull requests; publishing/deploying only happens for refs/heads/main.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/_image-deploy.yml"
      - ".github/workflows/_windows-package.yml"
      - "deploy/scripts/deploy-hook.sh"
      - "deploy/windows/**"
  workflow_dispatch:
    inputs:
      service:
        description: "What to build & deploy"
        type: choice
        options: [both, backend, admin]
        default: both

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/couple

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.pick.outputs.backend }}
      admin: ${{ steps.pick.outputs.admin }}
      version: ${{ steps.pick.outputs.version }}
      target: ${{ steps.pick.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-backend.yml'
              - '.github/workflows/_image-deploy.yml'
              - '.github/workflows/_windows-package.yml'
              - 'deploy/scripts/deploy-hook.sh'
              - 'deploy/windows/**'
            admin:
              - 'admin/**'
              - '.github/workflows/deploy-backend.yml'
              - '.github/workflows/_image-deploy.yml'
              - 'deploy/scripts/deploy-hook.sh'
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SERVICE: ${{ inputs.service }}
          F_BACKEND: ${{ steps.filter.outputs.backend }}
          F_ADMIN: ${{ steps.filter.outputs.admin }}
          TARGET: ${{ vars.DEPLOY_TARGET || 'windows' }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            b=false a=false
            case "$SERVICE" in both) b=true a=true ;; backend) b=true ;; admin) a=true ;; esac
          else
            b=$F_BACKEND a=$F_ADMIN
          fi
          case "$TARGET" in windows|docker) ;; *) echo "::error::vars.DEPLOY_TARGET must be windows or docker (got '$TARGET')"; exit 1 ;; esac
          {
            echo "backend=$b"
            echo "admin=$a"
            echo "version=edge-${GITHUB_SHA::7}"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"
          echo "backend=$b admin=$a target=$TARGET"

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build

  test-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  # Windows-native package (backend + admin + updater in one zip): built when either side changed.
  windows:
    needs: [changes, test-backend, test-admin]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.admin == 'true')
    uses: ./.github/workflows/_windows-package.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.changes.outputs.version }}
      publish-edge: ${{ github.ref == 'refs/heads/main' }}
      deploy: ${{ github.ref == 'refs/heads/main' && needs.changes.outputs.target == 'windows' }}
    secrets:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}

  image-backend:
    needs: [changes, test-backend]
    uses: ./.github/workflows/_image-deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      component: backend
      deploy: ${{ github.ref == 'refs/heads/main' && needs.changes.outputs.target == 'docker' }}
    secrets:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}

  image-admin:
    needs: [changes, test-admin]
    uses: ./.github/workflows/_image-deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      component: admin
      deploy: ${{ github.ref == 'refs/heads/main' && needs.changes.outputs.target == 'docker' }}
    secrets:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
