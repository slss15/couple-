org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# OTA partner-protocol gate (docs/ota-design.md §4); app<->app, NOT the client<->server /health protocolVersion. Single source of truth: compiled into BuildConfig and copied into
# release.json by CI. protocolVersion = what this build speaks; minPeerProtocol = oldest partner protocol it understands.
# Breaking change = two releases: first one that speaks both (minPeerProtocol unchanged), then raise minPeerProtocol.
couple.protocolVersion=1
couple.minPeerProtocol=1
